workflows:
  android-workflow:
    name: بناء تطبيق Android
    max_build_duration: 120
    environment:
      android_sdk: 33
      ndk: 21.3.6528147
    triggering:
      events:
        - push
        - pull_request
      branch:
        include_patterns:
          - main
          - develop

    scripts:
      - name: إعداد المتغيرات
        script: |
          echo "JAVA_HOME=/usr/lib/jvm/java-11-openjdk-amd64" >> $CM_BUILD_ENV
          echo "PATH=$JAVA_HOME/bin:$PATH" >> $CM_BUILD_ENV

      - name: منح الصلاحيات
        script: chmod +x gradlew

      - name: بناء APK (Debug)
        script: ./gradlew assembleDebug

      - name: بناء APK (Release)
        script: ./gradlew assembleRelease

      - name: تشغيل الاختبارات
        script: ./gradlew test

      - name: تحليل الكود
        script: ./gradlew lint

    artifacts:
      - app/build/outputs/apk/**/release/*.apk
      - app/build/outputs/apk/**/debug/*.apk
      - app/build/reports/tests/**
      - app/build/reports/lint-results*.html

    publishing:
      email:
        recipients:
          - $BUILD_NOTIFY_EMAIL
        notify:
          success: true
          failure: true
      slack:
        channel: '#builds'
        notify_on_build_start: true
        notify:
          success: true
          failure: true

  release-workflow:
    name: إصدار وتوزيع APK
    max_build_duration: 120
    environment:
      android_sdk: 33
    triggering:
      events:
        - tag
      tag:
        patterns:
          - pattern: 'v*'
            include: true

    scripts:
      - name: منح الصلاحيات
        script: chmod +x gradlew

      - name: بناء Release APK
        script: ./gradlew assembleRelease

    artifacts:
      - app/build/outputs/apk/release/*.apk

    publishing:
      github_releases: true
